<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Healthcare AI Assistant</title><link rel="stylesheet" href="style.css"></head>
<body>
<main><h1>Healthcare AI Assistant</h1><p class="notice">General information only. This assistant does not diagnose, prescribe, or book appointments.</p>
<section id="messages" aria-live="polite"></section>
<div class="suggestions"><button>How do I book an appointment?</button><button>What should I do in an emergency?</button></div>
<form id="chat"><input id="message" maxlength="2000" placeholder="Ask a healthcare or appointment question" required><button>Send</button></form>
</main><script src="app.js"></script>
</body>
</html>
